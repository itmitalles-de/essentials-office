name: nextcloud-restore-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${RESTORE_ROOT:?RESTORE_ROOT must be set}/postgres:/var/lib/postgresql/data
    networks:
      - restore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'appendonly yes\nrequirepass %s\n' "$$REDIS_PASSWORD" > /run/redis/redis.conf
        chown redis:redis /run/redis /run/redis/redis.conf
        exec /usr/bin/setpriv --reuid redis --regid redis --clear-groups redis-server /run/redis/redis.conf
    tmpfs:
      - /run/redis:size=1m,mode=0700
    volumes:
      - ${RESTORE_ROOT:?RESTORE_ROOT must be set}/redis:/data
    networks:
      - restore
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    image: nextcloud:34-apache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?NEXTCLOUD_ADMIN_USER must be set}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?NEXTCLOUD_ADMIN_PASSWORD must be set}
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      NEXTCLOUD_TRUSTED_DOMAINS: restore.invalid
      OVERWRITEPROTOCOL: http
      OVERWRITECLIURL: http://restore.invalid
    volumes:
      - ${RESTORE_ROOT:?RESTORE_ROOT must be set}/html:/var/www/html
      - ${RESTORE_ROOT:?RESTORE_ROOT must be set}/data:/var/www/html/data
    networks:
      - restore
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$status = @file_get_contents(\"http://127.0.0.1/status.php\"); exit($$status === false ? 1 : 0);'"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 30s

  cron:
    image: nextcloud:34-apache
    depends_on:
      app:
        condition: service_healthy
    entrypoint: /cron.sh
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      NEXTCLOUD_TRUSTED_DOMAINS: restore.invalid
      OVERWRITEPROTOCOL: http
      OVERWRITECLIURL: http://restore.invalid
    volumes:
      - ${RESTORE_ROOT:?RESTORE_ROOT must be set}/html:/var/www/html
      - ${RESTORE_ROOT:?RESTORE_ROOT must be set}/data:/var/www/html/data
    networks:
      - restore

networks:
  restore:
    internal: true
