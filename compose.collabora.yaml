services:
  collabora:
    image: collabora/code:26.04.3.1.1@sha256:6b70f91f0b6e9c76f75f162f58ef0a12cf9415d78e14713d33c0318ddc4a2cc0
    container_name: ${COLLABORA_CONTAINER_NAME:-nextcloud-collabora}
    profiles:
      - office
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      aliasgroup1: https://${COLLABORA_WOPI_HOST:?COLLABORA_WOPI_HOST must be a dot-escaped Nextcloud hostname}:443
      server_name: ${COLLABORA_PUBLIC_HOST:-office.itmitalles.de}
      DONT_GEN_SSL_CERT: "true"
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:net.proto=IPv4
        --o:logging.level=warning
    cap_add:
      - MKNOD
    tmpfs:
      - /tmp:size=512m,mode=1777
    networks:
      proxy_net:
        aliases:
          - collabora
    mem_limit: ${COLLABORA_MEMORY_LIMIT:-3g}
    cpus: ${COLLABORA_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9980/hosting/discovery >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 1m
