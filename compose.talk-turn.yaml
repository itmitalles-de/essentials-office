services:
  turn:
    image: coturn/coturn:4.17.2-r0@sha256:aa68aab64a3b929d57fc2924c98ea447bf996cf8dade2508e7b71eaf23f1f14e
    container_name: ${TURN_CONTAINER_NAME:-nextcloud-turn}
    profiles:
      - talk-turn
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: host
    command:
      - -c
      - /etc/coturn/turnserver.conf
    volumes:
      - ${TURN_CONFIG_FILE:-/etc/nextcloud/turnserver.conf}:/etc/coturn/turnserver.conf:ro
    tmpfs:
      - /var/lib/coturn:size=16m,mode=0700
      - /tmp:size=16m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient -p 3478 127.0.0.1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
